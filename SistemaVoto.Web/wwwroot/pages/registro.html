<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Votación</title>
    <link rel="stylesheet" href="/css/login-modern.css">
</head>
<body>

    <div class="bg-decor"></div>

    <div class="container">
        <div class="login-box" style="max-width: 520px;">

            <div class="brand">
                <div class="brand-badge"><span>📝</span></div>
                <h1>Sistema de Votación Electrónica</h1>
            </div>

            <h2>Registro de Votante</h2>
            <p class="sub">Crea tu cuenta para acceder al sistema.</p>

            <div id="mensaje" class="mensaje oculto"></div>

            <form id="registroForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" required autocomplete="given-name">
                    </div>

                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" required autocomplete="family-name">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="cedula">Cédula</label>
                        <input type="text" id="cedula" required maxlength="10" inputmode="numeric" autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" required autocomplete="tel">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required minlength="8" autocomplete="new-password">
                    <small style="display:block; margin-top:6px; color:#666;">
                        Mínimo 8 caracteres.
                    </small>
                </div>

                <button type="submit" class="btn-primary" id="btnRegistrar">
                    Registrarse
                </button>
            </form>

            <div class="footer-links">
                <a href="/index.html">¿Ya tienes cuenta? Inicia sesión</a>
            </div>

        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/registro.js"></script>
</body>
</html>
