<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrador</title>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>

<body>
    <div class="page">
        <div class="shell">

            <!-- HEADER SUPERIOR -->
            <div class="topbar">
                <div class="brand">
                    <h1>🛠️ Panel de Administración</h1>
                    <p id="subInfo">Administrador: <strong id="nombreUsuario"></strong></p>
                </div>

                <button onclick="cerrarSesion()" class="btnx danger">
                    Cerrar sesión
                </button>
            </div>

            <!-- PANEL PRINCIPAL -->
            <div class="panel">

                <div class="panel-head">
                    <div class="user-chip">
                        <span class="user-dot"></span>
                        <span>Administrador activo</span>
                    </div>

                    <div style="color:#c62828; font-weight:800;">
                        Sistema de Votación Electrónica
                    </div>
                </div>

                <div class="panel-body">

                    <div id="mensaje" class="mensaje oculto"></div>

                    <!-- RESUMEN -->
                    <div class="card2">
                        <h3>📊 Resumen General</h3>
                        <div id="resumen" class="stats-grid-modern">
                            <p>Cargando...</p>
                        </div>
                    </div>

                    <!-- ACCIONES PRINCIPALES -->
                    <div class="card2">
                        <h3>⚡ Gestión rápida</h3>

                        <div class="admin-actions-grid">
                            <button class="btnx primary" onclick="irUsuarios()">👤 Usuarios</button>
                            <button class="btnx primary" onclick="irAsignaciones()">📍 Asignaciones</button>
                            <button class="btnx primary" onclick="irIncidencias()">⚠️ Incidencias</button>
                            <button class="btnx soft" onclick="irLogs()">🧾 Logs</button>

                            <button class="btnx primary" onclick="irElecciones()">🗳️ Elecciones</button>
                            <button class="btnx primary" onclick="irListasPoliticas()">🎯 Listas</button>
                            <button class="btnx primary" onclick="irCandidatos()">👥 Candidatos</button>
                            <button class="btnx primary" onclick="irUbicaciones()">🏫 Ubicaciones</button>
                        </div>
                    </div>

                    <!-- ACTIVIDAD -->
                    <div class="card2">
                        <h3>🧾 Última Actividad</h3>
                        <div id="actividad">
                            <p>Cargando...</p>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-dashboard.js?v=2"></script>
</body>
</html>
