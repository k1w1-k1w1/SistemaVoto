<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Logs</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-box">
            <div class="dashboard-header">
                <h1>🧾 Logs</h1>
                <button onclick="window.location.href='/pages/Admin/dashboard.html'" class="btn-secondary">← Volver</button>
            </div>

            <div id="mensaje" class="mensaje oculto"></div>

            <div class="card">
                <h3>Filtros</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Acción</label>
                        <input id="fAccion" type="text" placeholder="Ej: CambioRol" />
                    </div>
                    <div class="form-group">
                        <label>UsuarioId</label>
                        <input id="fUsuarioId" type="number" min="1" />
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="cargarLogs()">🔎 Buscar</button>
                    <button class="btn-secondary" onclick="limpiarFiltros()">🧹 Limpiar</button>
                </div>
            </div>

            <div class="card">
                <h3>Listado</h3>
                <div class="table-wrap">
                    <table class="tabla" id="tablaLogs">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Acción</th>
                                <th>Descripción</th>
                                <th>Fecha</th>
                                <th>Usuario</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-logs.js"></script>
</body>
</html>
