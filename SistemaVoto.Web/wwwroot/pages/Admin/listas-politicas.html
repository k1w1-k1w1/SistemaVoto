<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Listas Políticas</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/admin-theme.css">
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <div>
                <h1>🎯 Gestión de Listas Políticas</h1>
                <p class="breadcrumb">Admin / Listas Políticas</p>
            </div>
            <div>
                <button onclick="window.location.href='/pages/Admin/dashboard.html'" class="btn-admin-secondary">
                    ← Volver
                </button>
            </div>
        </div>

        <div id="mensaje" class="mensaje oculto"></div>

        <!-- Botón crear -->
        <div class="admin-card">
            <button onclick="abrirModalCrear()" class="btn-admin-primary">
                ➕ Nueva Lista Política
            </button>
        </div>

        <!-- Lista de Listas Políticas -->
        <div class="admin-card">
            <h3>📋 Listado de Listas Políticas</h3>
            <div id="listaListas">
                <div class="admin-spinner"></div>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar -->
    <div id="modalLista" class="admin-modal">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3 id="modalTitulo">Nueva Lista Política</h3>
                <button class="admin-modal-close" onclick="cerrarModal()">&times;</button>
            </div>

            <form id="formLista">
                <input type="hidden" id="listaId">

                <div class="admin-form-group">
                    <label for="nombre">Nombre del Partido *</label>
                    <input type="text" id="nombre" class="admin-form-control" required>
                </div>

                <div class="admin-form-group">
                    <label for="siglas">Siglas</label>
                    <input type="text" id="siglas" class="admin-form-control" maxlength="10">
                </div>

                <div class="admin-form-group">
                    <label for="logo">URL del Logo</label>
                    <input type="url" id="logo" class="admin-form-control">
                </div>

                <div class="admin-form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" class="admin-form-control" rows="3"></textarea>
                </div>

                <div class="admin-actions-grid">
                    <button type="submit" class="btn-admin-primary">Guardar</button>
                    <button type="button" onclick="cerrarModal()" class="btn-admin-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-listas.js"></script>
</body>
</html>
