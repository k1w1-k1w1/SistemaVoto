<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ubicaciones</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/admin-theme.css">
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <div>
                <h1>📍 Gestión de Ubicaciones</h1>
                <p class="breadcrumb">Admin / Ubicaciones de Votación</p>
            </div>
            <div>
                <button onclick="window.location.href='/pages/Admin/dashboard.html'" class="btn-admin-secondary">
                    ← Volver
                </button>
            </div>
        </div>

        <div id="mensaje" class="mensaje oculto"></div>

        <!-- Botón crear -->
        <div class="admin-card">
            <button onclick="abrirModalCrear()" class="btn-admin-primary">
                ➕ Nueva Ubicación
            </button>
        </div>

        <!-- Lista de Ubicaciones -->
        <div class="admin-card">
            <h3>📋 Listado de Ubicaciones</h3>
            <div id="listaUbicaciones">
                <div class="admin-spinner"></div>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar -->
    <div id="modalUbicacion" class="admin-modal">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3 id="modalTitulo">Nueva Ubicación</h3>
                <button class="admin-modal-close" onclick="cerrarModal()">&times;</button>
            </div>

            <form id="formUbicacion">
                <input type="hidden" id="ubicacionId">

                <div class="admin-form-group">
                    <label for="nombre">Nombre del Recinto *</label>
                    <input type="text" id="nombre" class="admin-form-control" required>
                </div>

                <div class="admin-form-group">
                    <label for="direccion">Dirección *</label>
                    <textarea id="direccion" class="admin-form-control" rows="2" required></textarea>
                </div>

                <div class="admin-form-group">
                    <label for="numeroMesa">Número de Mesa *</label>
                    <input type="text" id="numeroMesa" class="admin-form-control" required>
                </div>

                <div class="admin-form-group">
                    <label for="capacidadVotantes">Capacidad de Votantes *</label>
                    <input type="number" id="capacidadVotantes" class="admin-form-control" min="1" required>
                </div>

                <div class="admin-actions-grid">
                    <button type="submit" class="btn-admin-primary">Guardar</button>
                    <button type="button" onclick="cerrarModal()" class="btn-admin-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-ubicaciones.js"></script>
</body>
</html>
