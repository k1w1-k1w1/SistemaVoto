<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-box">
            <div class="dashboard-header">
                <h1>👤 Gestión de Usuarios</h1>
                <button onclick="window.location.href='/pages/Admin/dashboard.html'" class="btn-secondary">← Volver</button>
            </div>

            <div id="mensaje" class="mensaje oculto"></div>

            <div class="card">
                <h3>Filtros</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Rol</label>
                        <select id="fRol">
                            <option value="">Todos</option>
                            <option value="Administrador">Administrador</option>
                            <option value="JefeDeJunta">JefeDeJunta</option>
                            <option value="Votante">Votante</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="fEstado">
                            <option value="">Todos</option>
                            <option value="PendienteVerificacion">PendienteVerificacion</option>
                            <option value="Activa">Activa</option>
                            <option value="Bloqueada">Bloqueada</option>
                            <option value="Suspendida">Suspendida</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Buscar</label>
                        <input id="fBuscar" type="text" placeholder="Nombre, cédula, email..." />
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="cargarUsuarios()">🔎 Buscar</button>
                    <button class="btn-secondary" onclick="limpiarFiltros()">🧹 Limpiar</button>
                </div>
            </div>

            <div class="card">
                <h3>Resultados</h3>
                <div class="table-wrap">
                    <table class="tabla" id="tablaUsuarios">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="7">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/admin-usuarios.js"></script>
</body>
</html>
