<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votación - Login</title>
    <link rel="stylesheet" href="/css/login-modern.css">
</head>
<body>

    <div class="bg-decor"></div>

    <div class="container">
        <div class="login-box">

            <div class="brand">
                <div class="brand-badge"><span>🗳️</span></div>
                <h1>Sistema de Votación Electrónica</h1>
            </div>

            <h2>Iniciar Sesión</h2>
            <p class="sub">Accede con tu correo y contraseña.</p>

            <div id="mensaje" class="mensaje oculto"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="btnLogin">
                    Ingresar
                </button>
            </form>

            <div class="footer-links">
                <a href="/pages/registro.html">¿No tienes cuenta? Regístrate</a>
            </div>

        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
